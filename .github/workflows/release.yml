name: Release kcc binaries

on:
  push:
    tags:
      - 'v*'   # triggers on: git tag v0.5.45 && git push --tags

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kcc binaries
        run: |
          chmod +x kcc kcc.AppImage
          ./kcc --version
          file kcc.exe

      - name: Create release archives
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist/klang-${TAG}-linux-x86_64
          cp kcc README.md dist/klang-${TAG}-linux-x86_64/
          cp -r examples dist/klang-${TAG}-linux-x86_64/
          tar -czf klang-${TAG}-linux-x86_64.tar.gz -C dist klang-${TAG}-linux-x86_64

          mkdir -p dist/klang-${TAG}-windows-x86_64
          cp kcc.exe README.md dist/klang-${TAG}-windows-x86_64/
          cp -r examples dist/klang-${TAG}-windows-x86_64/
          (cd dist && zip -r ../klang-${TAG}-windows-x86_64.zip klang-${TAG}-windows-x86_64)

          cp kcc.AppImage kcc-${TAG}-x86_64.AppImage
          cp kcc.exe kcc-${TAG}-windows-x86_64.exe
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          name: "K Language ${{ env.TAG }}"
          body: |
            ## K Language ${{ env.TAG }}

            ### Linux
            - Download `kcc-${{ env.TAG }}-x86_64.AppImage` (`chmod +x` and run), or extract `klang-${{ env.TAG }}-linux-x86_64.tar.gz`.

            ### Windows
            - Download `kcc-${{ env.TAG }}-windows-x86_64.exe` (or `klang-${{ env.TAG }}-windows-x86_64.zip`).
          files: |
            klang-${{ env.TAG }}-linux-x86_64.tar.gz
            klang-${{ env.TAG }}-windows-x86_64.zip
            kcc-${{ env.TAG }}-x86_64.AppImage
            kcc-${{ env.TAG }}-windows-x86_64.exe
            vscode-k/k-lang-0.1.0.vsix
          draft: false
          prerelease: false
