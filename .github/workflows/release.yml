name: Release kcc binary

on:
  push:
    tags:
      - 'v*'   # triggers on: git tag v0.5.4 && git push --tags

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kcc binary
        run: |
          chmod +x kcc
          ./kcc --version

      - name: Create release archive
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist/klang-${TAG}-linux-x86_64
          cp kcc dist/klang-${TAG}-linux-x86_64/
          cp README.md dist/klang-${TAG}-linux-x86_64/
          cp -r examples dist/klang-${TAG}-linux-x86_64/
          tar -czf klang-${TAG}-linux-x86_64.tar.gz -C dist klang-${TAG}-linux-x86_64
          echo "ARCHIVE=klang-${TAG}-linux-x86_64.tar.gz" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          name: "K Language ${{ env.TAG }}"
          body: |
            ## K Language ${{ env.TAG }}

            ### Install
            ```bash
            tar -xzf klang-${{ env.TAG }}-linux-x86_64.tar.gz
            chmod +x klang-${{ env.TAG }}-linux-x86_64/kcc
            mv klang-${{ env.TAG }}-linux-x86_64/kcc ~/.local/bin/kcc
            kcc --version
            ```

            ### What's included
            - `kcc` — the K compiler binary (x86-64 Linux)
            - `examples/` — example K programs
            - `README.md` — language reference
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: false
